name: CI
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: jobradar, POSTGRES_PASSWORD: jobradar, POSTGRES_DB: jobradar_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Integration tests apply migrations and truncate data here; it is a throwaway database.
      DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar_test
      TEST_DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # postinstall runs `prisma generate` (no database needed)
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
