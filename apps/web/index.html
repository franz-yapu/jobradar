<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ecf1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101411" media="(prefers-color-scheme: dark)" />
    <title>JobRadar</title>
    <!-- Apply the saved theme before the first paint, so a dark-mode user never sees a white flash. -->
    <script>
      try {
        var theme = localStorage.getItem("jobradar.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
