name: CI
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: jobradar, POSTGRES_PASSWORD: jobradar, POSTGRES_DB: jobradar_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Integration tests apply migrations and truncate data here; it is a throwaway database.
      DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar_test
      TEST_DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # postinstall runs `prisma generate` (no database needed)
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

  # Separate job: needs the Playwright browser download, so `pnpm quality` stays offline.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: jobradar, POSTGRES_PASSWORD: jobradar, POSTGRES_DB: jobradar_e2e }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # The E2E API empties this database; it only starts against names ending in _test or _e2e.
      E2E_DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar_e2e
      DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobradar/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  # Offline checks of the AWS infrastructure (SDD-010): no credentials, no plan, no apply.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.17.1, terraform_wrapper: false }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - run: terraform -chdir=bootstrap init -backend=false -input=false && terraform -chdir=bootstrap validate

  # The production images must build and the proxy must normalise client addresses (SDD-012); nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/api.Dockerfile -t jobradar-api:ci .
      - run: docker build -f deploy/web.Dockerfile -t jobradar-web:ci .
      # What the API receives from the proxy: a client cannot choose its own IP.
      - run: deploy/check-proxy.sh jobradar-web:ci
      # The production compose file must stay valid, publish no ports and refuse to deploy without its secrets.
      - run: |
          if env -u POSTGRES_PASSWORD -u WEB_ORIGIN -u ADMIN_EMAILS -u N8N_ENCRYPTION_KEY docker compose -f compose.prod.yml config >/dev/null 2>&1; then
            echo "compose.prod.yml must refuse to deploy without its required secrets"; exit 1
          fi
          docker compose -f compose.prod.yml config --format json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert not any(s.get('ports') for s in d['services'].values()), 'a service publishes ports'"
        env:
          POSTGRES_PASSWORD: ci-password
          WEB_ORIGIN: https://jobradar.example.test
          ADMIN_EMAILS: admin@example.test
          N8N_ENCRYPTION_KEY: ci-key
