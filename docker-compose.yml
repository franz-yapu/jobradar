services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: jobradar
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:5678/
    volumes: [n8ndata:/home/node/.n8n]
  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    volumes: [grafanadata:/var/lib/grafana]
volumes: { pgdata: {}, n8ndata: {}, grafanadata: {} }
