services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: jobradar
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
  n8n:
    # Pinned: workflows in n8n/workflows are exported from and tested on this version.
    image: docker.n8n.io/n8nio/n8n:2.40.5
    ports: ["${N8N_PORT:-5678}:5678"]
    # Lets the container reach the API running on the host (pnpm dev) on Linux too.
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
      # The workflows read the API address from the environment ($env).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      JOBRADAR_API_URL: ${JOBRADAR_API_URL:-http://host.docker.internal:3000}
      # Personal API token of the account the workflows act for (created in the app, see n8n/workflows/README.md)
      JOBRADAR_API_TOKEN: ${JOBRADAR_API_TOKEN:-}
      # Daily summary destination (the bot token is an n8n credential, never an env var)
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
  grafana:
    # Pinned: the provisioned dashboard was built and checked on this version.
    image: grafana/grafana:13.3.0
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on: [postgres]
    environment:
      # Password of the read-only grafana_reader role (set it with `pnpm grafana:setup`)
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai.json
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
  # Only for the SQS integration test (`docker compose --profile aws up -d localstack`); never started by default.
  localstack:
    profiles: ["aws"]
    image: localstack/localstack:3.8
    ports: ["${LOCALSTACK_PORT:-4566}:4566"]
    environment:
      SERVICES: sqs
volumes: { pgdata: {}, n8ndata: {}, grafanadata: {} }
